<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000;--s:#111;--c:#1a1a1a;--b:#2a2a2a;--b2:#333;--t:#fff;--m:#888;--m2:#555;--teal:#00c9b1;--orange:#ff6b35}
body{background:var(--bg);color:var(--t);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.au{animation:up .3s ease both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
nav{position:fixed;top:0;left:0;right:0;z-index:99;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(0,0,0,.95);border-bottom:1px solid var(--b);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer}
.lm{width:30px;height:30px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:700;font-size:12px;flex-shrink:0}
.ln{font-size:15px;font-weight:600}
.nav-r{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;border:none;white-space:nowrap;text-decoration:none}
.bg{background:transparent;border:1px solid var(--b);color:#fff}.bg:hover{border-color:var(--b2)}
.bw{background:#fff;color:#000;font-weight:600}.bw:hover{background:#e8e8e8}
.blg{padding:11px 24px;font-size:14px;border-radius:9px}
.input{width:100%;background:var(--s);border:1px solid var(--b);border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:14px;padding:10px 13px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--b2)}.input::placeholder{color:var(--m2)}
.ig{margin-bottom:16px}
.il{display:block;font-size:12px;color:var(--m);margin-bottom:6px;font-weight:500}
.page{padding-top:60px;min-height:100vh}
.sec{padding:60px 20px;max-width:1060px;margin:0 auto}
.sec-sm{max-width:660px;margin:0 auto;padding:60px 20px}
.st{font-size:clamp(24px,5vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:10px}
.ss{color:var(--m);font-size:14px;line-height:1.6}
.div{height:1px;background:var(--b)}
footer{border-top:1px solid var(--b);padding:40px 20px 24px;max-width:1060px;margin:0 auto}
.fg{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:32px;margin-bottom:32px}
.fb p{font-size:13px;color:var(--m);line-height:1.6;margin-top:12px;max-width:240px}
.fs{display:flex;gap:6px;margin-top:14px}
.fso{width:32px;height:32px;background:var(--s);border:1px solid var(--b);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--m);transition:all .15s}
.fso:hover{border-color:var(--b2);color:#fff}
.fc h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--m);margin-bottom:14px}
.fc ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.fc ul a{font-size:13px;color:var(--m);cursor:pointer;transition:color .15s}
.fc ul a:hover{color:#fff}
.fb2{display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid var(--b);flex-wrap:wrap;gap:10px}
.fb2 p{font-size:12px;color:var(--m2)}
.fl{display:flex;gap:16px}
.fl a{font-size:12px;color:var(--m2);cursor:pointer}.fl a:hover{color:var(--m)}
/* HOME */
.hero{padding:100px 20px 60px;max-width:1060px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.hstat{display:flex;gap:24px;padding-top:24px;border-top:1px solid var(--b);flex-wrap:wrap}
.sn{font-size:20px;font-weight:700;letter-spacing:-.02em}
.sl{font-size:11px;color:var(--m);margin-top:1px}
.vc{display:flex;flex-direction:column;gap:8px}
.vcc{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .15s}
.vcc:hover{border-color:var(--b2)}
.vav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.vi{flex:1}.vn{font-size:13px;font-weight:600}.vd{font-size:11px;color:var(--m);margin-top:1px}
.vbs{display:flex;align-items:center;gap:2px}
.vb{width:2px;background:var(--b);border-radius:2px;animation:wave 1s ease-in-out infinite}
.vcc:hover .vb{background:var(--teal)}
.vb:nth-child(1){height:4px}.vb:nth-child(2){height:9px;animation-delay:.1s}.vb:nth-child(3){height:14px;animation-delay:.2s}
.vb:nth-child(4){height:10px;animation-delay:.3s}.vb:nth-child(5){height:6px;animation-delay:.4s}
.vb:nth-child(6){height:10px;animation-delay:.5s}.vb:nth-child(7){height:14px;animation-delay:.6s}
.vp{width:28px;height:28px;background:var(--c);border:1px solid var(--b);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--m);transition:all .15s}
.vcc:hover .vp{background:#fff;color:#000;border-color:#fff}
.promo{background:linear-gradient(135deg,#ff6b35,#ffaa5c);padding:16px 20px;display:flex;align-items:center;gap:12px;border-radius:12px;max-width:1060px;margin:0 auto 48px}
.promo h3{font-size:14px;font-weight:600;color:#000}.promo p{font-size:11px;color:rgba(0,0,0,.7);margin-top:1px}
.pb{margin-left:auto;background:#000;color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
.cw{border-top:1px solid var(--b);background:var(--s)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cc{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:18px;cursor:pointer;transition:border-color .15s}

.ct{width:100%;height:90px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px}
.ct1{background:linear-gradient(135deg,#1a1a2e,#16213e)}.ct2{background:linear-gradient(135deg,#1a0a2e,#2d1b69)}
.ct3{background:linear-gradient(135deg,#0a1628,#1e3a5f)}.ct4{background:linear-gradient(135deg,#0a2818,#1a4a2e)}
.cc h3{font-size:13px;font-weight:600;margin-bottom:4px}.cc p{font-size:11px;color:var(--m);line-height:1.4}
.fg2{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--b);border:1px solid var(--b);border-radius:14px;overflow:hidden}
.fi{background:var(--bg);padding:24px 20px;transition:background .15s}
.fi:hover{background:var(--s)}
.fic{font-size:22px;margin-bottom:12px}.fit{font-size:14px;font-weight:600;margin-bottom:6px}.fid{font-size:12px;color:var(--m);line-height:1.5}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:36px}
.tc{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:20px}
.tst{font-size:12px;color:#f5c542;margin-bottom:10px;letter-spacing:2px}
.tq{font-size:13px;color:#fff;line-height:1.6;margin-bottom:14px;font-style:italic;font-weight:300}
.ta{display:flex;align-items:center;gap:8px}
.tav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.tn{font-size:12px;font-weight:600}.tr{font-size:11px;color:var(--m)}
.cb{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:50px 32px;text-align:center}
.cb h2{font-size:clamp(24px,4vw,38px);font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
.cb p{color:var(--m);font-size:14px;margin-bottom:24px}
.cn{font-size:11px;color:var(--m2);margin-top:10px}
.fl2{display:flex;flex-direction:column;gap:0;margin-top:32px}
.fi2{border-bottom:1px solid var(--b);padding:16px 0;cursor:pointer}
.fq{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500}
.fic2{color:var(--m);font-size:18px;transition:transform .2s}
.fa{display:none;font-size:13px;color:var(--m);line-height:1.6;margin-top:10px}
.fi2.open .fa{display:block}.fi2.open .fic2{transform:rotate(45deg)}
/* VOICES */
.vg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vcard{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:18px;transition:border-color .15s;cursor:pointer}
.vcard:hover{border-color:var(--b2)}
.vt{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.vav2{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.vname{font-size:14px;font-weight:600;margin-bottom:3px}
.vtags{display:flex;gap:4px;flex-wrap:wrap}
.vtag{font-size:10px;color:var(--m);background:var(--c);border:1px solid var(--b);padding:2px 6px;border-radius:100px}
.vwave{display:flex;align-items:center;gap:2px;margin-bottom:12px;height:20px}
.vwb{width:2px;background:var(--b);border-radius:2px;animation:wave 1s ease-in-out infinite}
.vcard:hover .vwb{background:var(--teal)}
.vwb:nth-child(1){height:3px}.vwb:nth-child(2){height:8px;animation-delay:.1s}.vwb:nth-child(3){height:14px;animation-delay:.2s}
.vwb:nth-child(4){height:18px;animation-delay:.3s}.vwb:nth-child(5){height:12px;animation-delay:.4s}
.vwb:nth-child(6){height:8px;animation-delay:.5s}.vwb:nth-child(7){height:14px;animation-delay:.6s}
.vwb:nth-child(8){height:18px;animation-delay:.7s}.vwb:nth-child(9){height:10px;animation-delay:.8s}
.vact{display:flex;gap:6px}
.vpb{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px;border-radius:8px;background:var(--c);border:1px solid var(--b);color:#fff;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .15s}
.vpb:hover{border-color:var(--b2)}
.vub{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;border-radius:8px;background:#fff;border:none;color:#000;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s}
.vub:hover{background:#e8e8e8}
.si{width:100%;background:var(--s);border:1px solid var(--b);border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;padding:9px 13px;outline:none;transition:border-color .15s;margin-bottom:14px}
.si:focus{border-color:var(--b2)}.si::placeholder{color:var(--m2)}
.fls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.fb3{padding:6px 14px;border-radius:100px;background:transparent;border:1px solid var(--b);color:var(--m);font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.fb3:hover,.fb3.active{background:var(--s);border-color:var(--b2);color:#fff}
/* PRICING */
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pc{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:22px 18px;position:relative;transition:border-color .15s}
.pc:hover{border-color:var(--b2)}
.pc.feat{background:#fff;border-color:#fff}
.pc.feat *{color:#000!important}
.ptag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#000;color:#fff!important;font-size:10px;font-weight:600;padding:3px 10px;border-radius:100px;white-space:nowrap;font-family:'Inter',sans-serif}
.pt{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--m);margin-bottom:14px}
.pp{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:4px}
.pp sub{font-size:13px;font-weight:400;letter-spacing:0}
.pch{font-size:12px;color:var(--teal);margin-bottom:18px;font-weight:500}
.pc.feat .pch{color:#009b85!important}
.ph{height:1px;background:var(--b);margin-bottom:14px}
.pc.feat .ph{background:rgba(0,0,0,.12)}
.pfl{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
.pf{font-size:12px;color:var(--m);display:flex;align-items:center;gap:6px}

.pc.feat .pf{color:#333!important}.pc.feat .pf::before{color:#009b85!important}
.pbtn{width:100%;padding:9px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;background:transparent;border:1px solid var(--b);color:#fff}
.pbtn:hover{border-color:var(--b2)}
.pc.feat .pbtn{background:#000;color:#fff;border-color:#000}
/* AUTH */
.aw{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:32px 16px}
.ac{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:32px;width:100%;max-width:400px}
.at{font-size:22px;font-weight:700;letter-spacing:-.02em;text-align:center;margin-bottom:6px}
.as{font-size:13px;color:var(--m);text-align:center;margin-bottom:22px}
.gb{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:transparent;border:1px solid var(--b);border-radius:8px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .15s}
.gb:hover{border-color:var(--b2)}
.gi{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#4285f4,#ea4335,#fbbc05,#34a853);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700}
.dor{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--m2);font-size:11px}

.sbtn{width:100%;padding:10px;background:#fff;color:#000;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s;margin-top:3px}
.sbtn:hover{background:#e8e8e8}
.alink{text-align:center;margin-top:16px;font-size:13px;color:var(--m)}
.alink a{color:#fff;cursor:pointer;font-weight:500}
.perks{border-top:1px solid var(--b);margin-top:20px;padding-top:16px;display:flex;flex-direction:column;gap:8px}
.pk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--m)}
.pi{width:22px;height:22px;background:rgba(0,201,177,.1);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.otp{display:flex;gap:8px;justify-content:center;margin:16px 0}
.oi{width:44px;height:50px;background:var(--c);border:2px solid var(--b);border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:20px;font-weight:700;text-align:center;outline:none;transition:border-color .15s}

.em{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#f87171;margin-bottom:14px;display:none}
.sm2{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#4ade80;margin-bottom:14px;display:none}
.fb4{display:inline-flex;align-items:center;gap:6px;background:rgba(0,201,177,.1);border:1px solid rgba(0,201,177,.2);padding:4px 10px;border-radius:100px;font-size:11px;color:var(--teal);margin-bottom:16px;font-weight:500}
/* DASHBOARD */
.dl{display:flex;min-height:calc(100vh - 60px)}
.sb{width:200px;flex-shrink:0;background:var(--s);border-right:1px solid var(--b);padding:16px 8px;position:fixed;top:60px;bottom:0;left:0;overflow-y:auto}
.sbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--m2);padding:0 10px;margin-bottom:5px;margin-top:16px}

.sl2{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--m);font-size:13px;cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif;width:100%;text-align:left;transition:all .15s}

.sl2.active{background:var(--c);color:#fff}
.si2{font-size:14px;flex-shrink:0}
.crb{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin:12px 0}

.cr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px}
.crd{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .15s;display:flex;align-items:center;gap:10px}

.cri{font-size:18px}.crl2{font-size:13px;font-weight:500}.crs{font-size:10px;color:var(--m);margin-top:1px}
.str{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px}
.stc{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:16px}
.stn{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
.stl{font-size:11px;color:var(--m)}.stch{font-size:10px;color:var(--teal);margin-top:4px}
.secrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

.sa{font-size:12px;color:var(--m);cursor:pointer}.sa:hover{color:#fff}
